[project]
name = "load-topology-skill"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
topology = "topology.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topology"]

[tool.pytest.ini_options]
pythonpath = ["src"]
